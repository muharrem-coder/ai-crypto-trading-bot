# quant-core: TimescaleDB + Redis + uygulama.
#
# Kullanım (Windows Docker Desktop dahil):
#   1) copy .env.example .env      (Linux/macOS: cp .env.example .env)  ve içini doldur
#   2) docker compose up -d --build
#   3) http://127.0.0.1:8000        (terminal)
#   Durdurmak:  docker compose down        (veriler volume'larda kalır)
#   Verileri de silmek:  docker compose down -v     (DİKKAT: tüm geçmiş gider)
#
# Şema / migration:
#   Uygulama her açılışta migrations/*.sql dosyalarını kendisi uygular ve schema_migrations
#   tablosunda kaydeder. Daha önce uygulanmış bir migration tekrar çalışmaz; içeriği değişmişse
#   uygulama hata verip durur. Bu yüzden DB konteynerine initdb betiği bağlamıyoruz.
#   Uygulamayı hiç başlatmasan da ilk DB açılışı güvenlidir: timescaledb imajı boş bir veritabanı
#   ve timescaledb eklentisini kendisi hazırlar, tablolar uygulama ilk bağlandığında oluşur.

name: quant-core

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  timescaledb:
    # 2.x-pg16 sabit etiket; "latest" kullanma, sürüm sürpriz yapmasın.
    image: timescale/timescaledb:2.31.0-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quant}
      POSTGRES_DB: ${POSTGRES_DB:-quant}
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    # Varsayılan olarak makineye açılmaz, sadece compose ağındaki uygulama erişir.
    # Hata ayıklamak için (sadece bu bilgisayardan) şu iki satırın başındaki # işaretini kaldır:
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *default-logging

  quant-core:
    build: .
    image: quant-core:local
    restart: unless-stopped
    init: true
    env_file: .env
    # environment, env_file'daki aynı isimli değerlerin üstüne yazar.
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-quant}:${POSTGRES_PASSWORD:-quant}@timescaledb:5432/${POSTGRES_DB:-quant}
      REDIS_URL: redis://redis:6379/0
      API_HOST: 0.0.0.0
      API_PORT: "8000"
      # Ön kontrol (preflight) portun makinede sadece 127.0.0.1 üzerinden açıldığını bilsin diye.
      API_PUBLISH_HOST: 127.0.0.1
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Konteyner içinde 0.0.0.0 dinler, ama makineye SADECE 127.0.0.1 üzerinden açılır.
    # Başında 127.0.0.1 olmadan ("8000:8000") yazma: terminal ağdaki herkese açılır.
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # Kapanırken açık işlemler / kayıtlar düzgün bitsin diye bekleme süresi.
    stop_grace_period: 30s
    logging: *default-logging

volumes:
  timescaledb-data:
  redis-data:
