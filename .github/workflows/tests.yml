name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pytest-asyncio pandas numpy
      - name: Test (no network, no browser)
        run: python -m pytest -q --ignore=tests/test_ui_terminal.py --ignore=tests/test_ui_real_stack.py
