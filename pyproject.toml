[project]
name = "quant-core"
version = "0.1.0"
description = "Claude Quant Terminal - hybrid autonomous crypto trading system (Phase 1-4: core, brokers, DB, hard-risk, data/news/quant, Claude decision, execution, API + terminal)"
requires-python = ">=3.11"
dependencies = [
  "ccxt>=4.3",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy[asyncio]>=2.0.29",
  "asyncpg>=0.29",
  "httpx>=0.27",
  "feedparser>=6.0",
  "anthropic>=0.40",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "aiosqlite>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pandas>=2.2", "numpy>=1.26", "playwright>=1.45"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "postgres: needs a real PostgreSQL/TimescaleDB, enabled by setting QUANT_TEST_DATABASE_URL",
]
